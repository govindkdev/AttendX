services:
  - type: web
    name: attendx-smart-attendance
    env: node
    plan: free
    region: oregon
    buildCommand: "npm install && cd server && npm install && cd .. && npm run build"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health
